<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatiVale</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="img/Pagina/Favicon.png" type="image/x-icon">
    <meta name="description" content="Somos Mativale, de la ciudad de Mercedes, Soriano. Estamos los sábados en Plaza Rivera y los domingos en Plaza Lavalleja, con productos para vos.">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">
            <img src="img/Pagina/LogoNombreTrans.png" alt="Logo">
        </div>
        <div class="buscador">
            <input type="text" id="inputBuscador" placeholder="Ingresa código o nombre del producto...">
            <button id="scanBtn" class="scan-btn">📱 Escanear</button>
        </div>
        <div class="contactos">
            <a href="https://wa.me/+59892882637" target="_blank" class="whatsapp"><img src="img/Pagina/whatsapp.svg" alt="Contacto whatsapp"></a>
            <a href="https://www.facebook.com/mirtha.pacilio/?locale=ms_MY" target="_blank" class="facebook"><img src="img/Pagina/facebook.svg" alt="Contacto facebook"></a>
            <button id="carritoBtn"><img src="img/Pagina/Carrito.svg" alt="Carrito"></button>
        </div>
    </nav>

    <section class="filtro">
        <div class="filtro-grupo">
            <label for="categoriaSelect">Categoría:</label>
            <select class="categoria" name="Categoria" id="categoriaSelect">
                <option value="todos" selected>Todas las categorías</option>
            </select>
        </div>
        <div class="filtro-grupo">
            <label for="precioMin">Precio Mínimo: <span id="precioMinValor">$0</span></label>
            <input type="range" class="Rango-Precio" id="precioMin" min="0" max="2000" value="0">
        </div>
        <div class="filtro-grupo">
            <label for="precioMax">Precio Máximo: <span id="precioMaxValor">$2000</span></label>
            <input type="range" class="Rango-Precio" id="precioMax" min="0" max="2000" value="2000">
        </div>
    </section>

    <!-- CONTENEDOR DE PRODUCTOS -->
    <section class="productos" id="productos">
        <!-- Aquí JS insertará las cards automáticamente -->
    </section>

    <!-- CONTENEDOR SCANNER -->
    <div id="scanner" class="scanner"></div>

    <!-- VENTANA FLOTANTE DEL CARRITO -->
    <div id="carritoModal" class="carrito-modal">
        <div class="carrito-content">
            <div class="carrito-header">
                <h2>Mi Carrito</h2>
                <button id="cerrarCarrito" class="close-btn">✕</button>
            </div>
            <div class="carrito-body">
                <p id="carritoVacio">El carrito está vacío</p>
                <div id="carritoItems" class="carrito-items"></div>
            </div>
        </div>
    </div>

    <!-- LIBRERÍA QUAGGA -->
    <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>

    <!-- LIBRERÍA JSPDF PARA GENERAR PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- SCRIPTS EXTERNOS -->
    <script src="productos.js"></script>
    <script src="filtro.js"></script>
    <script src="contacto.js"></script>
    <script src="script.js"></script>
    <script src="scan.js"></script>
    <script src="carrito.js"></script>
    <script src="imprimir.js"></script>
</body>
</html>
