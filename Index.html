<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">
            <img src="img/Pagina/LogoNombreTrans.png" alt="Logo">
        </div>
        <div class="buscador">
            <input type="text" id="inputBuscador" placeholder="Ingresa código del producto...">
            <button id="scanBtn" class="scan-btn">📱 Escanear</button>
        </div>
        <div class="contactos">
            <a href="https://wa.me/+59892882637" target="_blank" class="whatsapp"><img src="img/Pagina/whatsapp.svg" alt="Contacto whatsapp"></a>
            <a href="https://www.facebook.com/mirtha.pacilio/?locale=ms_MY" target="_blank" class="facebook"><img src="img/Pagina/facebook.svg" alt="Contacto facebook"></a>
        </div>
    </nav>

    <!-- CONTENEDOR DE PRODUCTOS -->
    <section class="productos" id="productos">
        <!-- Aquí JS insertará las cards automáticamente -->
    </section>

    <!-- CONTENEDOR SCANNER -->
    <div id="scanner" class="scanner"></div>

    <!-- LIBRERÍA QUAGGA -->
    <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>

    <!-- SCRIPTS EXTERNOS -->
    <script src="script.js"></script>
    <script src="scan.js"></script>
