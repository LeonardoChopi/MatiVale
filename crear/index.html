<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatiVale</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="../img/Pagina/Favicon.png" type="image/x-icon">
    <meta property="og:title" content="MatiVale - Productos de Calidad en Mercedes, Soriano">
    <meta name="description" content="Somos Mativale, de la ciudad de Mercedes, Soriano. Estamos los sábados en Plaza Rivera y los domingos en Plaza Lavalleja, con productos para vos.">
    <meta property="og:image" content="../img/Pagina/referencia.png">
    <link rel="stylesheet" href="../Style.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">
            <a href="../Index.html">
                <img src="../img/Pagina/LogoNombreTrans.png" alt="Logo">
            </a>
        </div>
    </nav>
    <section class="crear">
    <form id="formProducto">
        <input type="text" id="nombre" placeholder="Nombre del producto" required>

        <div>
            <label>Categorias</label>
            <div id="contenedorCategorias">
                <input type="text" class="categoriaInput" placeholder="Categoria">
            </div>
            <button type="button" id="agregarCategoria">+ Categoria</button>
        </div>

        <input type="text" id="descripcion" placeholder="Descripción" required>
        <input type="number" id="precio" placeholder="Precio" required>
        <input type="text" id="codigo" placeholder="Codigo" required>

        <div>
            <label>Imágenes</label>
            <div id="contenedorImagenes">
                <input type="text" class="imagenInput" placeholder="URL imagen">
            </div>
            <button type="button" id="agregarImagen">+ Imagen</button>
        </div>
        <div class="enviarproducto">
            <button type="button" id="crearproducto">Crear Producto</button>
            <button type="button" id="acumularProducto">Acumular Producto</button>
        </div>
        <br>
    </form>

    <div class="prod">
        <div class="devolverproducto">
            <h1>
                Producto creado
            </h1>
            <p>

            </p>
            <div class="copiar">
                    <button class="btn-agregar-carrito" id="copiarFragmento">Copiar fragmento</button>
                    <button class="btn-mas-info" id="copiarTodo">Copiar codigo entero</button>
            </div>
        </div>
        <div class="acumularproductos">
            <h1>Productos acumulados</h1>
            <div>
                <table class="tablaacumular">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Precio</th>
                            <th>Código</th>
                            <th>Categorías</th>
                            <th>Imágenes</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductosAcumulados">
                    </tbody>
                </table>
            </div>
            <div class="copiar">
                    <button class="btn-agregar-carrito" id="copiarFragmentotablatabla">Copiar fragmento tabla</button> 
                    <button class="btn-mas-info" id="copiarTodotabla">Copiar codigo entero tabla</button>
            </div>
        </div>
    </div>
    </section>

    <script src="../productos.js"></script>
    <script src="crear.js"></script>
    <script src="acumular.js"></script>
    <script src="copiar.js"></script>

</body>
</html>
